[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-wiki"
version = "0.1.0"
description = "LLM-powered curator for Obsidian-style Markdown research vaults"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.100.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.2",
  "typer>=0.12.5",
  "rich>=13.8.0",
  "watchdog>=5.0.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
research-wiki = "research_wiki.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["research_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
